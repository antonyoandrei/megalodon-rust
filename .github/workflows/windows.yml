name: Windows
# Builds only the owner's pushes and manual runs: untrusted pull-request code
# never runs here (external pull requests are closed by another workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MEGALODON_UPDATE_REPO: ${{ github.repository }}
      MEGALODON_BUILD_COMMIT: ${{ github.sha }}
      # Optional project keys, from repository secrets (empty when not set).
      MEGALODON_TMDB_TOKEN: ${{ secrets.MEGALODON_TMDB_TOKEN }}
      MEGALODON_FANART_KEY: ${{ secrets.MEGALODON_FANART_KEY }}
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Check and test
        run: |
          ./dev.ps1 -Action test
          ./dev.ps1 -Action lint
          ./desktop.ps1 -Action test
          ./desktop.ps1 -Action lint
          ./desktop.ps1 -Action test -Binary megalodon-setup
          ./desktop.ps1 -Action lint -Binary megalodon-setup
          ./client.ps1 -Action test
          ./client.ps1 -Action lint
          ./client.ps1 -Action build
      - name: Build installer and portable
        run: ./package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Megalodon-windows-${{ github.sha }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
      # Only the owner's push to the default branch makes an installable snapshot.
      # PRs/forks receive artifacts; they cannot publish a release from this job.
      - name: Publish installable commit
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = "build-$env:BUILD_COMMIT"
          $assets = Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName
          gh release view $tag --repo $env:BUILD_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:BUILD_REPOSITORY --clobber
          } else {
            gh release create $tag @assets --repo $env:BUILD_REPOSITORY --target $env:BUILD_COMMIT --prerelease --title "Megalodon · $($env:BUILD_COMMIT.Substring(0,7))" --notes-file docs/RELEASE.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el paquete del commit.' }
